 <circle cx="250" cy="285" r="22"/><circle cx="520" cy="285" r="22"/><circle cx="790" cy="285" r="22"/><circle cx="1060" cy="285" r="22"/>
 <circle cx="250" cy="475" r="22"/><circle cx="520" cy="475" r="22"/><circle cx="790" cy="475" r="22"/><circle cx="1060" cy="475" r="22"/>
 <circle cx="250" cy="665" r="22"/><circle cx="520" cy="665" r="22"/><circle cx="790" cy="665" r="22"/><circle cx="1060" cy="665" r="22"/>
</g>
