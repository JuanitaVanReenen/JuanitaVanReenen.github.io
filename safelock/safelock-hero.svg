<!-- feature callouts -->
<g font-family="Arial,Helvetica,sans-serif">
 <g transform="translate(1160,250)"><rect width="360" height="125" rx="18" fill="#0b1728" stroke="#395675"/><text x="24" y="36" fill="#ffbd16" font-size="17" font-weight="800">01  SELF-LOCKING NODE</text><text x="24" y="67" fill="#dce7f4" font-size="15">Primary capture + secondary retention</text><text x="24" y="91" fill="#aebbd0" font-size="14">with visible locked-state indication.</text></g>
 <g transform="translate(1160,395)"><rect width="360" height="125" rx="18" fill="#0b1728" stroke="#395675"/><text x="24" y="36" fill="#ffbd16" font-size="17" font-weight="800">02  PLATFORM RETENTION</text><text x="24" y="67" fill="#dce7f4" font-size="15">Positive deck engagement and</text><text x="24" y="91" fill="#aebbd0" font-size="14">integrated edge-protection interfaces.</text></g>
 <g transform="translate(1160,540)"><rect width="360" height="125" rx="18" fill="#0b1728" stroke="#395675"/><text x="24" y="36" fill="#ffbd16" font-size="17" font-weight="800">03  STABILITY ARCHITECTURE</text><text x="24" y="67" fill="#dce7f4" font-size="15">Adjustable bases + deployable</text><text x="24" y="91" fill="#aebbd0" font-size="14">stabilizers, subject to calculation.</text></g>
 <g transform="translate(1160,685)"><rect width="360" height="125" rx="18" fill="#0b1728" stroke="#395675"/><text x="24" y="36" fill="#ffbd16" font-size="17" font-weight="800">04  PROTECTED ACCESS</text><text x="24" y="67" fill="#dce7f4" font-size="15">Internal stair/access concept</text><text x="24" y="91" fill="#aebbd0" font-size="14">with protected landings and handrails.</text></g>
</g>
<text x="70" y="850" fill="#8fa4bd" font-family="Arial,Helvetica,sans-serif" font-size="14">CONCEPT / PRELIMINARY ENGINEERING DEVELOPMENT — NOT CERTIFIED OR APPROVED FOR SITE USE</text>
