<g fill="#111b27" stroke="#ffbd16" stroke-width="5"><rect x="75" y="840" width="90" height="24" rx="8"/><rect x="345" y="840" width="90" height="24" rx="8"/><rect x="880" y="840" width="90" height="24" rx="8"/><rect x="1150" y="840" width="90" height="24" rx="8"/></g>
