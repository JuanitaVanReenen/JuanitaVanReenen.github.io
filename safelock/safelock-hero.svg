<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">SAFELOCK Advanced Safety Scaffold System</title>
<desc id="d">Corporate engineering illustration of a modular scaffold with self-locking nodes, positive platform retention, stabilizers and protected access.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#102944"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9eef2"/><stop offset=".45" stop-color="#9aa8b3"/><stop offset="1" stop-color="#596773"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".08" stroke="#fff"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="70" y="92" fill="#fff" font-size="64" font-weight="800">SAFE<tspan fill="#ffbd16">LOCK</tspan></text>
 <text x="74" y="128" fill="#c9d8eb" font-size="20" letter-spacing="4">ADVANCED SAFETY SCAFFOLD SYSTEM</text>
 <text x="74" y="205" fill="#ffbd16" font-size="34" font-weight="800">ENGINEERED SAFETY ARCHITECTURE</text>
 <text x="74" y="245" fill="#dce7f4" font-size="22">Self-locking connections • positive platform retention • stability system • protected access</text>
</g>
