<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">MoneyMismatch financial reconciliation</title>
<desc id="desc">Invoices and payments flow through a reconciliation engine into matched and exception results.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233a"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62a8ff"/><stop offset="1" stop-color="#8ec5ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="700" rx="34" fill="url(#bg)"/>
<g opacity=".16" stroke="#8ec5ff">
  <path d="M60 610H1140M60 540H1140M60 470H1140M60 400H1140"/>
  <path d="M160 360V630M330 360V630M500 360V630M670 360V630M840 360V630M1010 360V630"/>
</g>
<text x="70" y="80" fill="#8ec5ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">MONEYMISMATCH</text>
<text x="70" y="118" fill="#f5f8fc" font-family="Arial,sans-serif" font-size="42" font-weight="800">See where the money doesn't match.</text>
<text x="70" y="150" fill="#9fb0c5" font-family="Arial,sans-serif" font-size="18">Compare records • detect duplicates • surface missing payments • act on exceptions</text>

<g transform="translate(70 205)">
  <rect width="270" height="115" rx="18" fill="#0d1a2b" stroke="#315579"/>
