name: Sulia backend tests

on:
  push:
    paths:
      - "sulia/backend/**"
      - ".github/workflows/sulia-backend.yml"
  pull_request:
    paths:
      - "sulia/backend/**"
      - ".github/workflows/sulia-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sulia/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
