name: Secure portfolio images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secure-portfolio-images.yml"

permissions:
  contents: write

jobs:
  secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy external portfolio images into repository
        run: |
          python3 - <<'PY'
          import hashlib, mimetypes, os, re, urllib.request
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          urls = sorted(set(re.findall(r'<img[^>]+src=["\'](https?://[^"\']+)["\']', s, re.I)))
          out = Path("assets/secured-portfolio")
          out.mkdir(parents=True, exist_ok=True)
          for url in urls:
              ext = Path(url.split("?",1)[0]).suffix.lower()
              if ext not in {".png",".jpg",".jpeg",".webp",".gif"}:
                  ext = ".png"
              name = hashlib.sha256(url.encode()).hexdigest()[:16] + ext
              target = out / name
              if not target.exists():
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                  target.write_bytes(data)
              s = s.replace(url, str(target).replace("assets/","assets/"))
          p.write_text(s)
          # Keep the approved AQUASEAL card image permanently inside the repository.
          aquaseal_url = "https://d2ol7oe51mr4n9.cloudfront.net/user_3JccjS9oSIhOaOB5TNzJnFtsjeP/d263c95e-cc01-48e6-ae5c-b74f774ab2fb.png"
          aquaseal_target = Path("assets/aquaseal/aquaseal-card.png")
          aquaseal_target.parent.mkdir(parents=True, exist_ok=True)
          req = urllib.request.Request(aquaseal_url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              aquaseal_target.write_bytes(r.read())
          s = s.replace("assets/aquaseal/aquaseal-card.jpg", "assets/aquaseal/aquaseal-card.png")
          s = s.replace("aquaseal/aquaseal-card.jpg", "assets/aquaseal/aquaseal-card.png")
          s = s.replace("aquaseal/aquaseal-hero.jpg", "assets/aquaseal/aquaseal-card.png")
          print(f"Secured {len(urls)} external image URLs and the AQUASEAL card image.")
          PY

      - name: Commit secured images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/secured-portfolio
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Store portfolio images in repository"
            git push
          fi
