name: PULZA FLOW Mobile Check

on:
  push:
    paths:
      - "pulzaflow-mobile/**"
      - ".github/workflows/pulzaflow-mobile.yml"
  pull_request:
    paths:
      - "pulzaflow-mobile/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulzaflow-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pulzaflow-mobile/package.json
      - run: npm install
      - run: npx expo-doctor
      - run: npx expo config --type public
