name: Product walkthrough videos
on:
  push:
    paths:
      - 'demo-manifest.json'
      - '.github/workflows/portfolio-demos.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render all product walkthroughs
        run: |
          set -e
          python3 - <<'PY'
          import json, html, subprocess, shutil
          from pathlib import Path

          manifest=json.load(open('demo-manifest.json'))
          out=Path('demo-assets'); out.mkdir(exist_ok=True)
          work=Path('.demo-work'); shutil.rmtree(work, ignore_errors=True); work.mkdir()

          def make_svg(path, name, subtitle, steps, active):
              rows=[]
              for i,s in enumerate(steps):
                  y=245+i*68
                  bg='#13243c' if i==active else '#0b1728'
                  border='#8ec5ff' if i==active else '#263b59'
                  text='#ffffff' if i==active else '#aebbd0'
                  rows.append(f'<rect x="90" y="{y}" width="1100" height="54" rx="14" fill="{bg}" stroke="{border}"/>')
                  rows.append(f'<circle cx="122" cy="{y+27}" r="15" fill="{border}"/>')
                  rows.append(f'<text x="122" y="{y+34}" text-anchor="middle" fill="#07111f" font-size="16" font-family="Arial" font-weight="700">{i+1}</text>')
                  rows.append(f'<text x="155" y="{y+35}" fill="{text}" font-size="23" font-family="Arial" font-weight="700">{html.escape(s)}</text>')
              progress=round(1100*(active+1)/len(steps))
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
              <rect width="1280" height="720" fill="#07111f"/>
              <rect x="45" y="35" width="1190" height="650" rx="28" fill="#0f1d31" stroke="#263b59" stroke-width="2"/>
              <text x="90" y="88" fill="#8ec5ff" font-family="Arial" font-size="24" font-weight="700">PRODUCT WALKTHROUGH</text>
              <text x="90" y="140" fill="white" font-family="Arial" font-size="38" font-weight="700">{html.escape(name)}</text>
              <text x="90" y="180" fill="#aebbd0" font-family="Arial" font-size="21">{html.escape(subtitle)}</text>
              {''.join(rows)}
              <text x="90" y="625" fill="#8293aa" font-family="Arial" font-size="17">LIVE DEMONSTRATION FLOW  •  STEP {active+1} OF {len(steps)}</text>
              <rect x="90" y="650" width="1100" height="8" rx="4" fill="#263b59"/>
              <rect x="90" y="650" width="{progress}" height="8" rx="4" fill="#8ec5ff"/>
              </svg>'''

          for p in manifest:
              slug=p['slug']; name=p['name']; subtitle=p['subtitle']
              raw=[x.strip() for x in p['flow'].split('→')]
              steps=raw if len(raw)>=3 else [p['description'],'Input','Process','Result']
              # Turn the product flow into a visible five-step walkthrough without claiming
              # that these are live backend operations.
              if len(steps)<5:
                  steps=steps+[f'{name} review', 'Buyer-ready result']
              steps=steps[:5]
              segs=[]
              for i in range(len(steps)):
                  svg=work/f'{slug}-{i}.svg'; mp4=work/f'{slug}-{i}.mp4'
                  svg.write_text(make_svg(svg,name,subtitle,steps,i))
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(svg),'-frames:v','1',str(work/f'{slug}-{i}.png')],check=True)
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-loop','1','-i',str(work/f'{slug}-{i}.png'),'-t','1.8','-r','24','-c:v','libx264','-preset','veryfast','-crf','23','-pix_fmt','yuv420p','-movflags','+faststart',str(mp4)],check=True)
                  segs.append(mp4)
              lst=work/f'{slug}.txt'
              lst.write_text(''.join(f"file '{x.resolve()}'\n" for x in segs))
              final=out/f'{slug}.mp4'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(lst),'-c','copy','-movflags','+faststart',str(final)],check=True)
          PY
      - name: Commit all improved walkthroughs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-assets/*.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade all product walkthrough videos"
          git push
