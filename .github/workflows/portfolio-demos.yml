name: Real MVP walkthrough recordings
on:
  push:
    paths:
      - 'demo-manifest.json'
      - '.github/workflows/portfolio-demos.yml'
      - '**/index.html'
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Record actual MVP workflows
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs'), cp=require('child_process');
          const root='http://127.0.0.1:4173';
          const flows={
            'productfit': async p=>{
              await p.goto(root+'/productfit/'); await p.getByText('Configure scenario',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(800); await p.getByText('Premium',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Generate buyer summary',{exact:true}).click().catch(()=>{});
            },
            'kaylics': async p=>{
              await p.goto(root+'/kaylics/'); await p.getByText('What happens if?',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(600); await p.getByText('Power failure',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Trace effects',{exact:true}).click().catch(()=>{});
            },
            'promisecheck': async p=>{
              await p.goto(root+'/promisecheck/'); await p.getByText('Test promise',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Break one condition',{exact:true}).click().catch(()=>{});
            },
            'robot-job-fit': async p=>{
              await p.goto(root+'/robot-job-fit/'); await p.waitForTimeout(600);
              await p.getByText('Continue',{exact:true}).click().catch(()=>{}); await p.waitForTimeout(700);
              await p.getByText('Compare candidates',{exact:true}).click().catch(()=>{});
            },
            'shileen': async p=>{
              await p.goto(root+'/shileen/'); await p.waitForTimeout(700);
              await p.getByText('Should I buy this car?',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Show missing information',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Do this next',{exact:true}).click().catch(()=>{});
            },
            'orveli': async p=>{
              await p.goto(root+'/orveli/'); await p.waitForTimeout(700);
              await p.getByText('Try the demo',{exact:false}).click().catch(()=>{});
              await p.waitForTimeout(900); await p.getByText('Next →',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Take control',{exact:true}).click().catch(()=>{});
            },
            'usperiment': async p=>{
              await p.goto(root+'/usperiment/'); await p.getByText('Try the experience',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Save & continue',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Explore',{exact:true}).first().click().catch(()=>{});
            },
            'next-action': async p=>{
              await p.goto(root+'/next-action/'); await p.waitForTimeout(700);
              await p.getByText('Airport preparation',{exact:false}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Build execution plan',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('✓ DONE',{exact:true}).click().catch(()=>{});
            },
            'maintenance-extraction': async p=>{
              await p.goto(root+'/maintenance-extraction/'); await p.waitForTimeout(700);
              await p.getByText('Play route sequence',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(1800);
            },
            'changeimpact': async p=>{
              await p.goto(root+'/changeimpact/'); await p.waitForTimeout(700);
              await p.getByText('▶ Play',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(1800); await p.getByText('Show Impact',{exact:true}).click().catch(()=>{});
            },
            'capital-decision-analyzer': async p=>{
              await p.goto(root+'/capital-decision-analyzer/'); await p.waitForTimeout(700);
              await p.getByText('Load example',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(500); await p.getByText('Run analysis',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(900); await p.getByText('Sensitivity',{exact:true}).click().catch(()=>{});
            },
            'meettrace': async p=>{
              await p.goto(root+'/meettrace/'); await p.waitForTimeout(900);
              await p.locator('#title').fill('Weekly launch review');
              await p.locator('#participants').fill('Operations, Product, Sales');
              await p.locator('#purpose').fill('Confirm the launch decision and assign the next action');
              await p.locator('#captureBtn').click();
              await p.waitForTimeout(900);
              await p.locator('#quick').fill('Approve the launch plan for next Monday');
              await p.locator('#quickType').selectOption('decisions');
              await p.locator('#addQuick').click();
              await p.waitForTimeout(900);
              await p.locator('#quick').fill('Operations to confirm final checklist');
              await p.locator('#quickType').selectOption('actions');
              await p.locator('#quickOwner').fill('Operations');
              await p.locator('#addQuick').click();
              await p.waitForTimeout(900);
              await p.locator('[data-tab="decisions"]').click();
              await p.waitForTimeout(800);
              await p.locator('[data-tab="actions"]').click();
              await p.waitForTimeout(800);
              await p.locator('#captureBtn').click();
              await p.waitForTimeout(900);
            },
            'pulzaflow': async p=>{
              await p.goto(root+'/pulzaflow/'); await p.waitForTimeout(800);
              await p.getByText('Create Post',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(600); await p.getByText('Publish',{exact:true}).click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Explore people',{exact:true}).click().catch(()=>{});
            },
            'sulia': async p=>{
              await p.goto(root+'/sulia/'); await p.waitForTimeout(800);
              const chat=p.locator('button').filter({hasText:/Chats/}).first(); if(await chat.count()) await chat.click();
              await p.waitForTimeout(500); const first=p.locator('button').filter({hasText:/.+/}).nth(3); await first.click().catch(()=>{});
              await p.waitForTimeout(700); await p.getByText('Create Face Introduction',{exact:true}).click().catch(()=>{});
            },
            'buildcheck': async p=>{
              await p.goto(root+'/buildcheck/'); await p.waitForTimeout(1200);
              await p.evaluate(()=>window.scrollTo(0,document.body.scrollHeight/2));
              await p.waitForTimeout(900);
            }
          };
          (async()=>{
            for(const [slug,flow] of Object.entries(flows)){
              const dir='.mvp-video-'+slug; fs.mkdirSync(dir,{recursive:true});
              const browser=await chromium.launch({headless:true});
              const ctx=await browser.newContext({viewport:{width:1440,height:900},recordVideo:{dir, size:{width:1440,height:900}}});
              const page=await ctx.newPage();
              try{await flow(page); await page.waitForTimeout(1200);}catch(e){console.log(slug,'flow warning',e.message);}
              await ctx.close(); await browser.close();
              const files=fs.readdirSync(dir).filter(x=>x.endsWith('.webm'));
              if(files.length){
                const src=dir+'/'+files[0], dst='demo-assets/'+slug+'.mp4';
                cp.execFileSync('ffmpeg',['-y','-loglevel','error','-i',src,'-c:v','libx264','-preset','veryfast','-crf','22','-pix_fmt','yuv420p','-movflags','+faststart',dst]);
                console.log('RECORDED',slug,dst);
              }
            }
          })();
          NODE
      - name: Commit real MVP recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-assets/*.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record unique walkthroughs from real MVP interfaces"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
