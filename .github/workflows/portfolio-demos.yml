name: Product-specific walkthrough videos
on:
  push:
    paths:
      - 'demo-manifest.json'
      - '.github/workflows/portfolio-demos.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render product-specific walkthroughs
        run: |
          set -e
          python3 - <<'PY'
          import json, html, subprocess, shutil
          from pathlib import Path
          manifest=json.load(open('demo-manifest.json'))
          out=Path('demo-assets'); out.mkdir(exist_ok=True)
          work=Path('.demo-work'); shutil.rmtree(work, ignore_errors=True); work.mkdir()
          archetypes = {
            'leakproof':'forensics','workready':'readiness','enterprise-decision-conflict-resolver':'conflict',
            'fieldflow-audit':'audit','capital-decision-analyzer':'finance','physical-ai-deployment-underwriting-engine':'underwriting',
            'productfit':'configuration','kaylics':'dependency','promisecheck':'promise','robot-job-fit':'fit',
            'shileen':'evidence','orveli':'replay','usperiment':'relationship',
            'adaptive-maintenance-capture-positioning-fixture':'engineering','ai-actionproof':'evidence',
            'acquisition-revenue-protection':'forensics','moneyquest-kids':'choice','enterprise-exitability-intelligence':'readiness',
            'workflow-gap-capture-engine':'workflow','hvac-technical-building-services-acquisition-intelligence':'acquisition',
            'technical-evidence-sufficiency-engine':'evidence','ai-reliance-calibration-engine':'calibration',
            'intelligent-charging-environment-safety-system':'safety','hydraulic-connection-management-system':'engineering',
            'next-action':'action','maintenance-extraction':'engineering','changeimpact':'propagation'
          }
          def esc(x): return html.escape(str(x))
          def svg_for(p, step, steps):
              slug=p['slug']; name=p['name']; subtitle=p['subtitle']; kind=archetypes.get(slug,'workflow')
              labels=steps
              if kind in ('finance','calibration'):
                  left=['INPUTS','METRICS','SCENARIO','SENSITIVITY','DECISION']; vals=['$1.20m','$1.48m','+23%','6.2%','REVIEW']
                  body=''.join(f'<rect x="90" y="{220+i*65}" width="500" height="48" rx="10" fill="#10243a" stroke="#31516f"/><text x="115" y="{250+i*65}" fill="#9fb3c8" font-family="Arial" font-size="16">{left[i]}</text><text x="550" y="{250+i*65}" text-anchor="end" fill="white" font-family="Arial" font-size="20" font-weight="700">{vals[i]}</text>' for i in range(5))
                  panel=body+f'<rect x="650" y="220" width="500" height="300" rx="18" fill="#0b1728" stroke="#31516f"/><text x="690" y="265" fill="#8ec5ff" font-family="Arial" font-size="17">DECISION VIEW</text><polyline points="700,455 790,410 870,430 950,350 1040,375 1120,300" fill="none" stroke="#8ec5ff" stroke-width="5"/><circle cx="1040" cy="375" r="8" fill="white"/><text x="690" y="555" fill="#aebbd0" font-family="Arial" font-size="18">{esc(labels[step])}</text>'
              elif kind in ('forensics','audit'):
                  rows=''.join(f'<rect x="90" y="{220+i*62}" width="1060" height="46" rx="8" fill="#0d1a2b" stroke="#263b59"/><text x="115" y="{249+i*62}" fill="#cbd6e5" font-family="Arial" font-size="16">Record {i+1}</text><text x="430" y="{249+i*62}" fill="#aebbd0" font-family="Arial" font-size="15">Evidence / signal / exception</text><text x="1090" y="{249+i*62}" text-anchor="end" fill="white" font-family="Arial" font-size="16">{'FLAGGED' if i==step else 'CHECKED'}</text>' for i in range(5))
                  panel=rows+f'<rect x="90" y="570" width="1060" height="55" rx="12" fill="#10243a" stroke="#8ec5ff"/><text x="115" y="605" fill="#8ec5ff" font-family="Arial" font-size="18" font-weight="700">{esc(labels[step])}</text>'
              elif kind in ('promise','fit','configuration'):
                  panel=f'<rect x="90" y="215" width="1060" height="350" rx="20" fill="#0b1728" stroke="#31516f"/><text x="125" y="260" fill="#8ec5ff" font-family="Arial" font-size="17">REQUIREMENTS</text>'+''.join(f'<rect x="125" y="{285+i*55}" width="480" height="42" rx="8" fill="#122238"/><text x="145" y="{312+i*55}" fill="#dce5f0" font-family="Arial" font-size="15">{esc(x)}</text>' for i,x in enumerate(labels[:3]))+f'<rect x="650" y="285" width="450" height="190" rx="14" fill="#10243a" stroke="#8ec5ff"/><text x="680" y="325" fill="#8ec5ff" font-family="Arial" font-size="17">RESULT</text><text x="680" y="380" fill="white" font-family="Arial" font-size="28" font-weight="700">{esc(labels[step])}</text><text x="680" y="425" fill="#aebbd0" font-family="Arial" font-size="16">Evidence and fit update</text>'
              elif kind in ('dependency','propagation','workflow','acquisition','readiness','underwriting','safety'):
                  nodes=[(170,330),(390,260),(610,380),(830,260),(1040,390)]
                  lines=''.join(f'<line x1="{nodes[i][0]}" y1="{nodes[i][1]}" x2="{nodes[i+1][0]}" y2="{nodes[i+1][1]}" stroke="#41617f" stroke-width="4"/>' for i in range(4))
                  circles=lines+''.join(f'<circle cx="{x}" cy="{y}" r="54" fill="#10243a" stroke="{"#8ec5ff" if i==step else "#31516f"}" stroke-width="4"/><text x="{x}" y="{y+6}" text-anchor="middle" fill="white" font-family="Arial" font-size="15">{i+1}</text>' for i,(x,y) in enumerate(nodes))
                  panel=circles+f'<text x="90" y="560" fill="#aebbd0" font-family="Arial" font-size="18">{esc(labels[step])}</text>'
              elif kind in ('engineering','action'):
                  panel=f'<rect x="90" y="215" width="1060" height="350" rx="22" fill="#0b1728" stroke="#31516f"/><rect x="150" y="275" width="360" height="210" rx="18" fill="#13243c" stroke="#41617f"/><text x="180" y="320" fill="#8ec5ff" font-family="Arial" font-size="17">WORK AREA</text><path d="M190 420 L320 320 L460 430" fill="none" stroke="#9fb3c8" stroke-width="8"/><circle cx="320" cy="320" r="16" fill="#8ec5ff"/><rect x="600" y="275" width="470" height="210" rx="18" fill="#10243a"/><text x="630" y="320" fill="#8ec5ff" font-family="Arial" font-size="17">CURRENT STEP</text><text x="630" y="375" fill="white" font-family="Arial" font-size="25" font-weight="700">{esc(labels[step])}</text><text x="630" y="420" fill="#aebbd0" font-family="Arial" font-size="16">Position → verify → execute</text>'
              elif kind in ('relationship','choice','replay'):
                  panel=f'<rect x="90" y="215" width="1060" height="350" rx="22" fill="#0b1728" stroke="#31516f"/><circle cx="300" cy="370" r="90" fill="#13243c" stroke="#8ec5ff" stroke-width="4"/><circle cx="940" cy="370" r="90" fill="#13243c" stroke="#8ec5ff" stroke-width="4"/><line x1="390" y1="370" x2="850" y2="370" stroke="#41617f" stroke-width="6"/><text x="300" y="380" text-anchor="middle" fill="white" font-family="Arial" font-size="22">A</text><text x="940" y="380" text-anchor="middle" fill="white" font-family="Arial" font-size="22">B</text><rect x="485" y="325" width="270" height="90" rx="18" fill="#10243a" stroke="#8ec5ff"/><text x="620" y="365" text-anchor="middle" fill="#8ec5ff" font-family="Arial" font-size="16">INTERACTION</text><text x="620" y="395" text-anchor="middle" fill="white" font-family="Arial" font-size="18">{esc(labels[step])}</text>'
              else:
                  panel=f'<rect x="90" y="215" width="1060" height="350" rx="22" fill="#0b1728" stroke="#31516f"/><rect x="130" y="255" width="700" height="58" rx="12" fill="#13243c"/><text x="160" y="292" fill="#dce5f0" font-family="Arial" font-size="18">{esc(labels[step])}</text><rect x="130" y="345" width="460" height="42" rx="10" fill="#10243a"/><rect x="130" y="405" width="560" height="42" rx="10" fill="#10243a"/><rect x="860" y="255" width="240" height="190" rx="18" fill="#10243a" stroke="#8ec5ff"/><text x="980" y="305" text-anchor="middle" fill="#8ec5ff" font-family="Arial" font-size="17">STATUS</text><text x="980" y="365" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">ACTIVE</text>'
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
              <rect width="1280" height="720" fill="#07111f"/><rect x="45" y="35" width="1190" height="650" rx="28" fill="#0f1d31" stroke="#263b59" stroke-width="2"/>
              <text x="90" y="88" fill="#8ec5ff" font-family="Arial" font-size="22" font-weight="700">PRODUCT DEMONSTRATION</text>
              <text x="90" y="138" fill="white" font-family="Arial" font-size="36" font-weight="700">{esc(name)}</text>
              <text x="90" y="175" fill="#aebbd0" font-family="Arial" font-size="19">{esc(subtitle)}</text>
              {panel}
              <text x="90" y="625" fill="#8293aa" font-family="Arial" font-size="16">SCENE {step+1} / {len(labels)}  •  PRODUCT-SPECIFIC WALKTHROUGH</text>
              </svg>'''
          for p in manifest:
              slug=p['slug']; steps=[x.strip() for x in p['flow'].split('→')]
              if len(steps)<5: steps += ['Review','Result']
              steps=steps[:5]; segs=[]
              for i in range(5):
                  svg=work/f'{slug}-{i}.svg'; png=work/f'{slug}-{i}.png'; mp4=work/f'{slug}-{i}.mp4'
                  svg.write_text(svg_for(p,i,steps))
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-i',str(svg),str(png)],check=True)
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-loop','1','-i',str(png),'-t','2.2','-r','24','-c:v','libx264','-preset','veryfast','-crf','23','-pix_fmt','yuv420p','-movflags','+faststart',str(mp4)],check=True)
                  segs.append(mp4)
              lst=work/f'{slug}.txt'; lst.write_text(''.join(f"file '{x.resolve()}'\n" for x in segs))
              subprocess.run(['ffmpeg','-y','-loglevel','error','-f','concat','-safe','0','-i',str(lst),'-c','copy','-movflags','+faststart',str(out/f'{slug}.mp4')],check=True)
          PY
      - name: Commit product-specific walkthroughs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-assets/*.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Create product-specific walkthrough demos"
          git push
