name: BuildCheck demo video
on:
  push:
    paths:
      - 'buildcheck/index.html'
      - 'buildcheck/demo_source/**'
      - '.github/workflows/buildcheck-demo.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render demo video
        shell: bash
        run: |
          set -e
          mkdir -p buildcheck/rendered
          cat > buildcheck/rendered/slide1.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#07111f"/><rect x="55" y="55" width="1170" height="610" rx="28" fill="#0f1d31" stroke="#263b59" stroke-width="2"/><text x="100" y="145" fill="#8ec5ff" font-family="Arial" font-size="28" font-weight="700">BUILDCHECK RECONCILE</text><text x="100" y="260" fill="white" font-family="Arial" font-size="58" font-weight="700">Reconcile. Validate.</text><text x="100" y="335" fill="white" font-family="Arial" font-size="58" font-weight="700">Build with Confidence.</text><text x="100" y="430" fill="#aebbd0" font-family="Arial" font-size="26">Independent source-to-destination data-integrity checking.</text></svg>
          SVG
          cat > buildcheck/rendered/slide2.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#f8fafc"/><rect width="100%" height="90" fill="#1b2c3f"/><text x="50" y="58" fill="white" font-family="Arial" font-size="34" font-weight="700">1 · Source → Destination</text><rect x="80" y="190" width="430" height="190" rx="20" fill="#eef3f8" stroke="#b8c3cf" stroke-width="3"/><rect x="770" y="190" width="430" height="190" rx="20" fill="#eef3f8" stroke="#b8c3cf" stroke-width="3"/><text x="135" y="290" fill="#1b2c3f" font-family="Arial" font-size="34" font-weight="700">SOURCE DATA</text><text x="825" y="290" fill="#1b2c3f" font-family="Arial" font-size="34" font-weight="700">DESTINATION</text><path d="M520 285 H760" stroke="#3975a8" stroke-width="8"/><path d="M760 285 l-30 -22 v44 z" fill="#3975a8"/><text x="80" y="485" fill="#56616d" font-family="Arial" font-size="25">Bring the two datasets together for an independent comparison.</text></svg>
          SVG
          cat > buildcheck/rendered/slide3.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#f8fafc"/><rect width="100%" height="90" fill="#1b2c3f"/><text x="50" y="58" fill="white" font-family="Arial" font-size="34" font-weight="700">2 · Match & Normalize</text><g font-family="Arial" font-size="25" font-weight="700"><rect x="80" y="200" width="330" height="110" rx="18" fill="#eef3f8" stroke="#b8c3cf"/><text x="125" y="267" fill="#1b2c3f">MATCH KEY</text><rect x="475" y="200" width="330" height="110" rx="18" fill="#eef3f8" stroke="#b8c3cf"/><text x="525" y="267" fill="#1b2c3f">NORMALIZE</text><rect x="870" y="200" width="330" height="110" rx="18" fill="#eef3f8" stroke="#b8c3cf"/><text x="955" y="267" fill="#1b2c3f">COMPARE</text></g><text x="80" y="420" fill="#56616d" font-family="Arial" font-size="25">Records are compared using deterministic reconciliation rules.</text></svg>
          SVG
          cat > buildcheck/rendered/slide4.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#f8fafc"/><rect width="100%" height="90" fill="#1b2c3f"/><text x="50" y="58" fill="white" font-family="Arial" font-size="34" font-weight="700">3 · Find the Exceptions</text><g font-family="Arial" font-size="23" font-weight="700" text-anchor="middle"><g fill="#fff4f4" stroke="#d5a0a0"><rect x="55" y="200" width="220" height="115" rx="16"/><rect x="295" y="200" width="220" height="115" rx="16"/><rect x="535" y="200" width="220" height="115" rx="16"/><rect x="775" y="200" width="220" height="115" rx="16"/><rect x="1015" y="200" width="210" height="115" rx="16"/></g><g fill="#1b2c3f"><text x="165" y="268">MISSING</text><text x="405" y="268">EXTRA</text><text x="645" y="268">CHANGED</text><text x="885" y="268">DUPLICATE</text><text x="1120" y="268">BLANK KEY</text></g></g><text x="55" y="430" fill="#56616d" font-family="Arial" font-size="25">Only the records that need attention are surfaced.</text></svg>
          SVG
          cat > buildcheck/rendered/slide5.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#f8fafc"/><rect width="100%" height="90" fill="#1b2c3f"/><text x="50" y="58" fill="white" font-family="Arial" font-size="34" font-weight="700">4 · Review the Result</text><rect x="80" y="170" width="1120" height="230" rx="20" fill="#eef3f8" stroke="#b8c3cf" stroke-width="3"/><text x="125" y="235" fill="#3975a8" font-family="Arial" font-size="30" font-weight="700">RECONCILIATION RESULTS</text><text x="125" y="300" fill="#1b2c3f" font-family="Arial" font-size="28">Missing · Extra · Changed · Duplicate · Blank key</text><text x="125" y="355" fill="#56616d" font-family="Arial" font-size="24">Structured exception list → operational review → reconciliation report</text></svg>
          SVG
          cat > buildcheck/rendered/slide6.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="100%" height="100%" fill="#07111f"/><rect x="55" y="55" width="1170" height="610" rx="28" fill="#0f1d31" stroke="#263b59" stroke-width="2"/><text x="100" y="165" fill="#8ec5ff" font-family="Arial" font-size="28" font-weight="700">BUILDCHECK RECONCILE</text><text x="100" y="275" fill="white" font-family="Arial" font-size="48" font-weight="700">Source → Reconcile → Exceptions → Report</text><text x="100" y="365" fill="#aebbd0" font-family="Arial" font-size="25">A focused browser MVP for construction and operational data migrations.</text><text x="100" y="470" fill="#8ec5ff" font-family="Arial" font-size="22">Early-stage working prototype · not a live production integration</text></svg>
          SVG
          for i in 1 2 3 4 5 6; do ffmpeg -y -loglevel error -i buildcheck/rendered/slide${i}.svg -frames:v 1 buildcheck/rendered/slide${i}.png; done
          printf "file '%s'\nduration 5\n" buildcheck/rendered/slide1.png buildcheck/rendered/slide2.png buildcheck/rendered/slide3.png buildcheck/rendered/slide4.png buildcheck/rendered/slide5.png buildcheck/rendered/slide6.png > buildcheck/rendered/concat.txt
          echo "file 'buildcheck/rendered/slide6.png'" >> buildcheck/rendered/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i buildcheck/rendered/concat.txt -vf "fps=30,format=yuv420p" -c:v libx264 -preset medium -crf 24 -movflags +faststart buildcheck/demo.mp4
          rm -rf buildcheck/rendered
      - name: Commit generated demo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buildcheck/demo.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add BuildCheck product demo video"
          git push