name: PAZUMO verification

on:
  push:
    paths:
      - 'pazumo/**'
      - '.github/workflows/pazumo-ci.yml'
  pull_request:
    paths:
      - 'pazumo/**'
      - '.github/workflows/pazumo-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pazumo/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test