name: Package Forgotten Forest for PlayGama
on:
  push:
    branches: [main]
    paths:
      - 'forgotten-forest/index.html'
      - 'forgotten-forest/playgama-bridge-config.json'
      - '.github/workflows/package-forgotten-forest.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PlayGama archive
        run: |
          mkdir -p dist
          cp forgotten-forest/index.html dist/index.html
          cp forgotten-forest/playgama-bridge-config.json dist/playgama-bridge-config.json
          cd dist
          zip -9 ../Forgotten-Forest-PlayGama-Sandbox.zip index.html playgama-bridge-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Forgotten-Forest-PlayGama-Sandbox
          path: Forgotten-Forest-PlayGama-Sandbox.zip
          if-no-files-found: error
          retention-days: 7
