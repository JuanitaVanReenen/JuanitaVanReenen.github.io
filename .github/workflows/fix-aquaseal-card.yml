name: Fix AQUASEAL card image permanently
on:
  push:
    paths:
      - .github/workflows/fix-aquaseal-card.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the approved AQUASEAL card photo
        run: |
          mkdir -p assets/aquaseal
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3JccjS9oSIhOaOB5TNzJnFtsjeP/d263c95e-cc01-48e6-ae5c-b74f774ab2fb.png" -o assets/aquaseal/aquaseal-card.png
      - name: Point the AQUASEAL card to the local permanent asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace("assets/aquaseal/aquaseal-card.jpg","assets/aquaseal/aquaseal-card.png")
          s=s.replace("aquaseal/aquaseal-hero.jpg","assets/aquaseal/aquaseal-card.png")
          p.write_text(s)
          PY
      - name: Commit permanent card image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aquaseal/aquaseal-card.png index.html
          git diff --cached --quiet || git commit -m "Store AQUASEAL card photo permanently"
          git push
