<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let W=900,H=600,dpr=1,soundOn=false,audioCtx=null,musicOscillators=[],weatherElapsed=0,weather='sunny',rainCycle=0,tool='move',coins=20,seeds=5,harvest=0,last=0,toastTimer=0,decorations=0,animalsPlayed=0,questRewarded=false,dailyGiftDate='',pendingAction=null,decorItems=[],expanded=false,meadowExpanded=false,greenhouseBuilt=false,butterflyGarden=false,butterflyDate='',butterfliesSeen=0,fishingRod=false,fishingDock=false,fishDate='',fishToday=0,worldReady=false,wood=0,stone=0,birdhouseCrafted=false,birdhouseBuilt=false,birdhouseGiftDate='',craftedItems={bench:0,lantern:0,scarecrow:0},placedCrafts=[];const stored={pink:0,gold:0,blue:0};const storedFish={silver:0,golden:0,blue:0};let fishCaught=0;const bouquets={pink:0,gold:0,blue:0};const flowerBook={pink:0,gold:0,blue:0};const animalBonds={bunny:0,fox:0,hedgehog:0,raccoon:0};const flowerTypes=['pink','gold','blue'];let villageOrder={kind:'pink',qty:2,reward:18,done:false};const flowerColors={pink:'#f2a3c4',gold:'#f4cf62',blue:'#83b9e8'};
const player={x:450,y:390,tx:450,ty:390,walk:false};const villagers=[{id:'mara',name:'Mara',role:'Florist',fx:.57,fy:.48,skin:'#b97850',hair:'#49352b',shirt:'#e88caf',apron:'#fff0d5',friend:0,lines:['Welcome to Blossom Flowers! The garden looks lovely today.','I can make bouquets from three matching flowers.','Would you grow more golden flowers for the village?']},{id:'ben',name:'Ben',role:'Farmer',fx:.77,fy:.60,skin:'#d99b70',hair:'#5b3928',shirt:'#5a9b65',apron:'#e9d7a8',friend:0,lines:['Good morning! The farm is full of possibilities.','I sell seeds for just three coins.','A good harvest makes everyone happy!']},{id:'elsie',name:'Elsie',role:'Baker',fx:.86,fy:.29,skin:'#edc39a',hair:'#a65c38',shirt:'#79a9c8',apron:'#fff1d8',friend:0,lines:['Fresh bread and berry pies every morning!','One day I hope to open a bigger bakery.','Thank you for visiting our little village!']},{id:'pip',name:'Pip',role:'Village Helper',fx:.43,fy:.30,skin:'#d89b78',hair:'#6a4937',shirt:'#e8b85e',apron:'#fff0d5',friend:0,lines:['I help everyone in the village!','Check the notice board for new requests.','Thank you for helping our neighbours!']},{id:'nia',name:'Nia',role:'Young Gardener',fx:.33,fy:.70,skin:'#8f5d43',hair:'#30251f',shirt:'#c77eae',apron:'#f7e5bc',friend:0,lines:['I am learning to grow the tallest sunflowers!','The butterflies love the orchard.','One day I will have a garden of my own!']},{id:'tom',name:'Tom',role:'Delivery Runner',fx:.64,fy:.68,skin:'#edc39a',hair:'#8b5838',shirt:'#6c9fc3',apron:'#f6e2bd',friend:0,lines:['I deliver fresh produce all around the village.','The market is busiest in the morning!','Thanks for helping our little village thrive!']}];villagers.forEach((v,i)=>{v.patrol=i%2===0?0:1;v.phase=i*.9;v.targetX=0;v.targetY=0;v.nextWander=0;});
const beds=[{fx:.28,fy:.47,state:'empty',grow:0},{fx:.37,fy:.47,state:'empty',grow:0},{fx:.28,fy:.60,state:'empty',grow:0},{fx:.37,fy:.60,state:'empty',grow:0},{fx:.67,fy:.50,state:'empty',grow:0},{fx:.76,fy:.50,state:'empty',grow:0}];const bunny={x:710,y:440,happy:0};const fox={x:W*.15,y:H*.72,happy:0};const hedgehog={x:W*.57,y:H*.76,happy:0};const raccoon={x:W*.69,y:H*.84,happy:0};const extraBeds=[{fx:.48,fy:.49,state:'empty',grow:0},{fx:.58,fy:.49,state:'empty',grow:0},{fx:.48,fy:.62,state:'empty',grow:0},{fx:.58,fy:.62,state:'empty',grow:0}];const meadowBeds=[{fx:.16,fy:.48,state:'empty',grow:0},{fx:.16,fy:.60,state:'empty',grow:0},{fx:.84,fy:.58,state:'empty',grow:0},{fx:.84,fy:.70,state:'empty',grow:0},{fx:.38,fy:.80,state:'empty',grow:0},{fx:.49,fy:.84,state:'empty',grow:0},{fx:.60,fy:.80,state:'empty',grow:0},{fx:.71,fy:.84,state:'empty',grow:0}];const greenhouseBeds=[{fx:.22,fy:.68,state:'empty',grow:0},{fx:.31,fy:.68,state:'empty',grow:0},{fx:.40,fy:.68,state:'empty',grow:0}];let sparkles=[];
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);beds.forEach(b=>{b.x=W*b.fx;b.y=H*b.fy});extraBeds.forEach(b=>{b.x=W*b.fx;b.y=H*b.fy});meadowBeds.forEach(b=>{b.x=W*b.fx;b.y=H*b.fy});greenhouseBeds.forEach(b=>{b.x=W*b.fx;b.y=H*b.fy});bunny.x=W*.80;bunny.y=H*.73;fox.x=W*.15;fox.y=H*.73;hedgehog.x=W*.57;hedgehog.y=H*.76;raccoon.x=W*.69;raccoon.y=H*.84;villagers.forEach(v=>{v.x=W*v.fx;v.y=H*v.fy});if(!worldReady){player.x=W*.50;player.y=H*.70;player.tx=player.x;player.ty=player.y;worldReady=true}else{player.x=Math.min(W-18,Math.max(18,player.x));player.y=Math.min(H-22,Math.max(35,player.y));player.tx=Math.min(W-18,Math.max(18,player.tx));player.ty=Math.min(H-22,Math.max(35,player.ty))}}addEventListener('resize',resize);resize();
function say(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}function stats(){const eb=document.getElementById('expandBtn');if(eb)eb.textContent=meadowExpanded?'🌿 Land expanded':expanded?'🌳 Meadow (60🪙)':'🌿 Expand (20🪙)';document.getElementById('coins').textContent=coins;document.getElementById('seeds').textContent=seeds;document.getElementById('harvest').textContent=harvest;document.getElementById('collection').textContent=Object.values(flowerBook).reduce((a,b)=>a+b,0)}
function updateQuests(){const planted=[...beds,...(expanded?extraBeds:[]),...(meadowExpanded?meadowBeds:[]),...(greenhouseBuilt?greenhouseBeds:[])].filter(b=>['seed','sprout','ready'].includes(b.state)).length;const done=[planted>=2,harvest>=1,animalsPlayed>=1];document.getElementById('questCount').textContent=done.filter(Boolean).length+'/3';document.getElementById('questList').innerHTML=['Plant 2 flowers','Harvest 1 flower','Play with a friend'].map((q,i)=>(done[i]?'✓ ':'○ ')+q).join('<br>');if(done.every(Boolean)&&!questRewarded){questRewarded=true;coins+=15;say('All garden goals complete! Bonus: 15 coins!');stats();save()}}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#a9d58f';ctx.fillRect(0,0,W,H);
// grass texture
for(let i=0;i<100;i++){let x=(i*137)%W,y=(i*83)%H;ctx.strokeStyle=i%2?'#8fc47d':'#b9dfa0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+3,y-5);ctx.stroke()}
// paths
ctx.fillStyle='#e8d7ad';ctx.beginPath();ctx.moveTo(W*.39,H);ctx.lineTo(W*.54,H);ctx.lineTo(W*.68,H*.39);ctx.lineTo(W*.55,H*.39);ctx.closePath();ctx.fill();ctx.beginPath();ctx.ellipse(W*.48,H*.73,W*.24,H*.10,-.15,0,Math.PI*2);ctx.fill();
// pond
ctx.fillStyle='#70c6d2';ctx.beginPath();ctx.ellipse(W*.82,H*.20,W*.105,H*.09,-.15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d4f4ed';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.fillText('✦',W*.80,H*.20);
// Gatherable woodland resources and a player-built birdhouse
ctx.fillStyle='#76513a';ctx.beginPath();ctx.ellipse(W*.13,H*.80,22,10,0,0,Math.PI*2);ctx.fill();for(let i=0;i<3;i++){ctx.save();ctx.translate(W*(.115+i*.014),H*(.79+(i%2)*.012));ctx.rotate(-.3+i*.3);ctx.fillStyle='#a8754d';ctx.fillRect(-4,-13,8,26);ctx.restore()}ctx.fillStyle='#fff4dc';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('WOOD',W*.13,H*.84);ctx.fillStyle='#858b91';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W*(.89+i*.012),H*(.78+(i%2)*.012),8,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fff4dc';ctx.fillText('STONE',W*.91,H*.83);ctx.textAlign='left';
if(birdhouseBuilt){const bx=W*.49,by=H*.34;ctx.fillStyle='#8b6240';ctx.fillRect(bx-3,by+8,6,36);ctx.fillStyle='#c88952';ctx.fillRect(bx-17,by-10,34,25);ctx.fillStyle='#8b4f3a';ctx.beginPath();ctx.moveTo(bx-21,by-10);ctx.lineTo(bx,by-28);ctx.lineTo(bx+21,by-10);ctx.closePath();ctx.fill();ctx.fillStyle='#5b493c';ctx.beginPath();ctx.arc(bx,by+1,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4dc';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('BIRDHOUSE',bx,by+55);ctx.textAlign='left'}

if(fishingDock){ctx.fillStyle='#8b6240';ctx.fillRect(W*.755,H*.275,W*.13,H*.022);ctx.fillStyle='#d8b27a';for(let i=0;i<5;i++)ctx.fillRect(W*(.765+i*.024),H*.265,3,12);ctx.strokeStyle='#8b6240';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.78,H*.29);ctx.lineTo(W*.78,H*.33);ctx.moveTo(W*.86,H*.29);ctx.lineTo(W*.86,H*.33);ctx.stroke();ctx.fillStyle='#fff4dc';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('FISHING DOCK',W*.82,H*.345);ctx.textAlign='left'}

// cottage
rounded(W*.055,H*.12,W*.19,H*.22,12,'#f7e6bf');ctx.fillStyle='#b96e59';ctx.beginPath();ctx.moveTo(W*.035,H*.14);ctx.lineTo(W*.15,H*.035);ctx.lineTo(W*.27,H*.14);ctx.closePath();ctx.fill();rounded(W*.125,H*.22,W*.05,H*.12,5,'#9b674e');ctx.fillStyle='#8bb6bd';ctx.fillRect(W*.075,H*.18,W*.035,H*.04);ctx.fillRect(W*.19,H*.18,W*.035,H*.04);

for(let i=0;i<14;i++){let x=(i*W/13),y=H*.91+(i%2)*8;flower(x,y,.65)}
// beds
[...beds,...(expanded?extraBeds:[]),...(meadowExpanded?meadowBeds:[]),...(greenhouseBuilt?greenhouseBeds:[])].forEach(b=>{rounded(b.x-29,b.y-20,58,43,8,'#8a5b3c');rounded(b.x-25,b.y-16,50,35,6,'#68452f');if(b.state==='seed'||b.state==='sprout'||b.state==='ready'){ctx.fillStyle='#4d8b48';ctx.beginPath();ctx.ellipse(b.x,b.y+4,7+b.grow*2,4+b.grow,0,0,Math.PI*2);ctx.fill();if(b.state==='sprout'||b.state==='ready'){ctx.strokeStyle='#347e42';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y+4);ctx.lineTo(b.x,b.y-12-b.grow*3);ctx.stroke();ctx.fillStyle=b.state==='ready'?(flowerColors[b.flower]||flowerColors.pink):'#72b96a';ctx.beginPath();ctx.arc(b.x-5,b.y-13-b.grow*3,5,0,7);ctx.arc(b.x+5,b.y-13-b.grow*3,5,0,7);ctx.fill();if(b.state==='ready'){ctx.fillStyle='#f6d46f';ctx.beginPath();ctx.arc(b.x,b.y-13-b.grow*3,4,0,7);ctx.fill()}}}});
// meadow orchard boundary and sign when the second land expansion is unlocked
if(meadowExpanded){ctx.fillStyle='#8d6849';ctx.fillRect(W*.08,H*.43,W*.10,5);ctx.fillRect(W*.08,H*.43,5,H*.27);ctx.fillStyle='#f8e8c8';ctx.fillRect(W*.045,H*.39,W*.18,25);ctx.fillStyle='#5b7545';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('MEADOW ORCHARD',W*.135,H*.407);ctx.textAlign='left';for(let i=0;i<5;i++){let tx=W*(.28+i*.11),ty=H*.90;ctx.fillStyle='#8a6040';ctx.fillRect(tx-4,ty-12,8,22);ctx.fillStyle='#5a9b59';ctx.beginPath();ctx.arc(tx,ty-20,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e6a35d';ctx.beginPath();ctx.arc(tx-6,ty-22,4,0,Math.PI*2);ctx.arc(tx+7,ty-15,4,0,Math.PI*2);ctx.fill()}}

drawBarn(W*.045,H*.31,Math.min(W*.22,150),Math.min(H*.25,132));drawStall(W*.72,H*.39,Math.min(W*.22,148),Math.min(H*.18,92),'FARM FRESH','#e9a45e','#4c9b59');drawStall(W*.48,H*.27,Math.min(W*.19,126),Math.min(H*.16,78),'BLOSSOM FLOWERS','#d98db2','#f2c5d5');drawBakery(W*.78,H*.13,Math.min(W*.18,124),Math.min(H*.18,98));drawBridge(W*.57,H*.24,Math.min(W*.18,130));drawWindmill(W*.31,H*.16,Math.min(W*.12,82));
// tree
