<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Software Verification — Flexible Line Recovery Robot</title><style>body{font-family:system-ui;background:#071018;color:#edf6f8;margin:0}main{max-width:1000px;margin:auto;padding:42px 6%}h1{font-size:clamp(38px,6vw,64px);line-height:1}.status{padding:18px;border-radius:14px;background:#10212b;border:1px solid #2d4b59;font-size:24px;font-weight:800}.test{padding:15px;margin:10px 0;border:1px solid #29414e;border-radius:12px;background:#0d1921}.pass{border-left:5px solid #76e0ad}.fail{border-left:5px solid #ff7e7e}pre{background:#061018;padding:15px;overflow:auto}a{color:#9ce5fa}</style></head><body><main><p>AUTOMATED SOFTWARE VERIFICATION</p><h1>Software Test Dashboard</h1><div id="status" class="status">Running…</div><div id="tests"></div><pre id="json"></pre><p><a href="software-console.html">Software console</a> · <a href="integration-console.html">Hardware integration simulator</a></p></main><script src="recovery-engine.js"></script><script src="software-test-suite.js"></script><script>const r=window.RecoverySoftwareTests.runSuite();document.getElementById('status').textContent=`${r.passed}/${r.total} automated checks passed`;document.getElementById('tests').innerHTML=r.tests.map(t=>`<div class="test ${t.pass?'pass':'fail'}"><strong>${t.pass?'PASS':'FAIL'} — ${t.name}</strong><div>${t.details}</div></div>`).join('');document.getElementById('json').textContent=JSON.stringify(r,null,2);</script></body></html>
